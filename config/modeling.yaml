# =============================================================================
# config/modeling.yaml - Predictive model and training configuration
# =============================================================================
#
# This file is versioned. It contains model hyperparameters, feature lists,
# target thresholds, and inference behavior for the predictive stack.
# Secrets and environment-specific values still belong in .env.
# =============================================================================

mlflow:
  experiment_name: weather_australia

training:
  test_size: 0.2
  random_state: 42

inference:
  rain_probability_threshold: 0.5

labels:
  rain_min_mm: 1.0
  heatwave_temp_celsius: 35.0
  frost_temp_celsius: 2.0
  storm_rainfall_mm: 10.0
  storm_gust_kmh: 50.0

features:
  numerical:
    - min_temp
    - max_temp
    - rainfall
    - evaporation
    - sunshine_hours
    - wind_gust_speed
    - wind_speed_9am
    - wind_speed_3pm
    - humidity_9am
    - humidity_3pm
    - pressure_9am
    - pressure_3pm
    - cloud_9am
    - cloud_3pm
    - temp_9am
    - temp_3pm
    - rain_today
    - month
    - day_of_year
    - max_temp_lag1
    - max_temp_lag2
    - min_temp_lag1
    - rainfall_lag1
    - rainfall_lag2
    - pressure_3pm_lag1
    - max_temp_rolling7
    - rainfall_rolling7
    - humidity_3pm_rolling7
    - pressure_tendency
    - temp_anomaly
    - consec_hot_days
    - hot_day_lag1
    - hot_day_lag2
    - precipitation_hours
    - rainfall_intensity
    - shortwave_radiation_sum
    - vpd_9am
    - vpd_3pm
    - wind_speed_100m_9am
    - wind_speed_100m_3pm
  categorical:
    - wind_gust_dir
    - wind_dir_9am
    - wind_dir_3pm
    - city
    - state
    - season

xgboost:
  base:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
  models:
    rain_tomorrow: {}
    max_temp_tomorrow: {}
    weather_type_tomorrow:
      n_estimators: 400
    heatwave_risk:
      max_depth: 4
      n_estimators: 200
    frost_risk:
      max_depth: 4
      n_estimators: 200
    storm_probability: {}
