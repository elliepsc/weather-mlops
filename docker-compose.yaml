services:

  # ── Weather API (FastAPI) ────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow:/app/mlflow
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    depends_on:
      - api

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

  # ── Airflow — PostgreSQL (metadata DB) ───────────────────────────────────────
  # Airflow a besoin d'une vraie base relationnelle en prod.
  # SQLite (utilisé par standalone en dev) ne supporte pas la concurrence
  # entre webserver, scheduler et workers.
  airflow-db:
    image: postgres:15.7
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # ── Airflow — Init (migration DB + création user admin) ───────────────────────
  # Ce service tourne une seule fois au premier lancement pour initialiser la DB
  # et créer le compte admin. Il s'arrête ensuite (restart: on-failure).
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file: .env
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: weather-mlops-internal-api-secret
      AIRFLOW__API_AUTH__JWT_SECRET: weather-mlops-jwt-secret
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./mlflow:/opt/airflow/mlflow
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "airflow db migrate"
    restart: on-failure

  # ── Airflow — API Server (UI sur localhost:8083) ─────────────────────────────
  # Airflow 3.x : "webserver" renommé en "api-server". Sert l'UI React et l'API REST.
  # Séparé du scheduler pour redémarrer l'UI sans interrompre les tâches en cours.
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file: .env
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8083:8080"   # 8083 sur l'hôte → 8080 dans le container (port par défaut Airflow)
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: weather-mlops-internal-api-secret
      AIRFLOW__API_AUTH__JWT_SECRET: weather-mlops-jwt-secret
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./mlflow:/opt/airflow/mlflow
      - airflow_logs:/opt/airflow/logs
    command: api-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Airflow — Scheduler (exécution des DAGs) ──────────────────────────────────
  # Le scheduler surveille les DAGs et lance les tâches au bon moment.
  # Avec LocalExecutor, les tâches tournent dans le même container que le scheduler
  # (pas besoin de workers séparés).
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file: .env
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: weather-mlops-internal-api-secret
      AIRFLOW__API_AUTH__JWT_SECRET: weather-mlops-jwt-secret
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
      PYTHONPATH: /opt/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
      - ./mlflow:/opt/airflow/mlflow
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    restart: unless-stopped

volumes:
  grafana_data:
  prometheus_data:
  airflow_db_data:   # données PostgreSQL Airflow (persistées entre les restarts)
  airflow_logs:      # logs des tâches Airflow
