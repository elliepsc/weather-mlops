name: weather_mlops_analytics
version: "1.0.0"
config-version: 2

profile: weather_mlops_analytics

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  weather_mlops_analytics:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # --- Always on: Power BI dashboard tables ---
      bi:
        +materialized: table
        +schema: marts
        +enabled: true
      location:
        +materialized: table
        +schema: marts
        +enabled: true
      # --- On-demand groups: disabled by default, activate via --vars ---
      # dbt run --select marts.weather --vars '{"enable_weather_marts": true}'
      weather:
        +materialized: table
        +schema: marts
        +enabled: "{{ var('enable_weather_marts', false) }}"
      forecast:
        +materialized: table
        +schema: marts
        +enabled: "{{ var('enable_forecast_marts', false) }}"
      quality:
        +materialized: table
        +schema: marts
        +enabled: "{{ var('enable_quality_marts', false) }}"
      scorecard:
        +materialized: table
        +schema: marts
        +enabled: "{{ var('enable_scorecard_marts', false) }}"
      model:
        +materialized: table
        +schema: marts
        +enabled: "{{ var('enable_model_marts', false) }}"
      drift:
        +materialized: table
        +schema: marts
        +enabled: "{{ var('enable_drift_marts', false) }}"
      operations:
        +materialized: table
        +schema: marts
        +enabled: "{{ var('enable_ops_marts', false) }}"

vars:
  # Lookback windows
  forecast_timeline_days: 90
  mlops_health_days: 30
  completeness_baseline_days: 90
  # Data horizon: rows before this date are excluded from all staging models.
  # Change here to widen or narrow the analytics window without touching SQL.
  min_date: "2016-01-01"
  # Mart group toggles — all off by default, activate via --vars at run time.
  # See analytics/docs/mart_activation.md for usage patterns.
  enable_weather_marts: false
  enable_forecast_marts: false
  enable_quality_marts: false
  enable_scorecard_marts: false
  enable_model_marts: false
  enable_drift_marts: false
  enable_ops_marts: false
