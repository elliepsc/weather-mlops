name: CI — Weather Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Imports · DAG syntax · Config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pipeline imports
        run: |
          python -c "from pipeline.locations import LOCATIONS; assert len(LOCATIONS) == 26"
          python -c "from pipeline.database import init_db"
          python -c "from pipeline.fetch_weather import fetch_city"
          python -c "from pipeline.process_weather import add_features, compute_comfort_score"
          python -c "from pipeline.train_models import load_all_models"
          python -c "from pipeline.predict import generate_predictions"
          python -c "from pipeline.run_pipeline import run_daily"
          python -c "from api.app import app"

      - name: DAG syntax check
        run: |
          python - <<'EOF'
          import ast
          from pathlib import Path
          failed = []
          dag_files = sorted(Path("dags").glob("*.py"))
          for f in dag_files:
              try:
                  ast.parse(f.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  failed.append(f"{f.name}: {e}")
          if failed:
              raise SystemExit("\n".join(failed))
          print(f"{len(dag_files)} DAG files parse cleanly")
          EOF

      - name: Config YAML validation
        run: |
          python - <<'EOF'
          import yaml
          checks = {
              "config/mlops.yaml":   ["ingestion", "monitoring", "training"],
              "config/modeling.yaml": ["features", "xgboost", "labels"],
          }
          for path, required_keys in checks.items():
              with open(path) as f:
                  cfg = yaml.safe_load(f)
              missing = [k for k in required_keys if k not in cfg]
              if missing:
                  raise SystemExit(f"{path} missing top-level keys: {missing}")
          print("Config files valid")
          EOF

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q --tb=short
