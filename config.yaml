xgboost:
  # Shared base params (applied to all models before model-specific overrides)
  base:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1

  # Per-model overrides (merged on top of base)
  models:
    rain_tomorrow: {}       # binary — uses base as-is
    max_temp_tomorrow: {}   # regression — uses base as-is
    weather_type_tomorrow:  # multiclass — more estimators for 4 classes
      n_estimators: 400
    heatwave_risk:          # rare event — shallower trees to avoid overfit
      max_depth: 4
      n_estimators: 200
    frost_risk:             # rare event
      max_depth: 4
      n_estimators: 200
    storm_probability: {}   # binary — uses base as-is

training:
  test_size: 0.2
  random_state: 42

mlflow:
  experiment_name: weather_australia
